<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="Capability illustration for core team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14526a"/>
      <stop offset="100%" stop-color="#23b77d"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4dd6ff"/>
      <stop offset="100%" stop-color="#3ed39a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.30)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,.08)"/>
    </linearGradient>
    <filter id="blur-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#101938" flood-opacity=".16"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#121b3d" flood-opacity=".12"/>
    </filter>
    <style>
    .title { font: 800 44px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.96); letter-spacing: .04em; }
    .eyebrow { font: 700 18px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.82); letter-spacing: .18em; text-transform: uppercase; }
    .label { font: 700 20px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.9); }
    .small { font: 600 16px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.74); }
</style>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1450" cy="140" r="250" fill="#8cecff" opacity=".42" filter="url(#blur-lg)"/>
  <circle cx="220" cy="1040" r="300" fill="#ffe0a8" opacity=".30" filter="url(#blur-lg)"/>
  <circle cx="1120" cy="920" r="180" fill="#ffffff" opacity=".08" filter="url(#blur-lg)"/>
  <g opacity=".12" stroke="#ffffff" fill="none">
    <path d="M70 180c160-60 320-74 470-18s316 68 520 8 332-58 470 8"/>
    <path d="M20 248c186-76 378-90 570-24s390 74 574 10 316-66 436-26"/>
    <path d="M84 1034c220-76 388-86 542-22s338 74 544 14 310-66 424-26"/>
  </g>
  
  <g filter="url(#shadow)"><rect x="126" y="150" width="1348" height="820" rx="54" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24"/></g>
  <text x="188" y="242" class="eyebrow">TEAM</text>
  <text x="188" y="316" class="title">Cross-functional builders</text>
  <g transform="translate(198 408)">
    <rect x="0" y="0" width="1188" height="420" rx="44" fill="#ffffff" opacity=".10"/>
    <circle cx="208" cy="188" r="88" fill="#ffffff" opacity=".92"/>
    <circle cx="448" cy="148" r="72" fill="#8cecff" opacity=".94"/>
    <circle cx="666" cy="220" r="82" fill="#ffe0a8" opacity=".94"/>
    <circle cx="886" cy="156" r="68" fill="#9cf4d6" opacity=".94"/>
    <circle cx="1060" cy="238" r="62" fill="#ffffff" opacity=".76"/>
    <path d="M286 188c44-28 88-42 132-40 44 2 78 18 110 46 60-38 118-52 174-38 56 14 104 44 150 92 42-24 84-30 126-18 42 12 74 38 98 78" stroke="#ffffff" stroke-opacity=".64" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="120" y="308" width="940" height="60" rx="30" fill="#ffffff" opacity=".12"/>
  </g>

</svg>
