<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="Capability illustration for roadmap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6f58"/>
      <stop offset="100%" stop-color="#6f5fff"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ad2a0"/>
      <stop offset="100%" stop-color="#8b72ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.30)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,.08)"/>
    </linearGradient>
    <filter id="blur-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#101938" flood-opacity=".16"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#121b3d" flood-opacity=".12"/>
    </filter>
    <style>
    .title { font: 800 44px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.96); letter-spacing: .04em; }
    .eyebrow { font: 700 18px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.82); letter-spacing: .18em; text-transform: uppercase; }
    .label { font: 700 20px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.9); }
    .small { font: 600 16px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.74); }
</style>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1450" cy="140" r="250" fill="#91f7d2" opacity=".42" filter="url(#blur-lg)"/>
  <circle cx="220" cy="1040" r="300" fill="#cfd3ff" opacity=".30" filter="url(#blur-lg)"/>
  <circle cx="1120" cy="920" r="180" fill="#ffffff" opacity=".08" filter="url(#blur-lg)"/>
  <g opacity=".12" stroke="#ffffff" fill="none">
    <path d="M70 180c160-60 320-74 470-18s316 68 520 8 332-58 470 8"/>
    <path d="M20 248c186-76 378-90 570-24s390 74 574 10 316-66 436-26"/>
    <path d="M84 1034c220-76 388-86 542-22s338 74 544 14 310-66 424-26"/>
  </g>
  
  <g filter="url(#shadow)"><rect x="126" y="150" width="1348" height="820" rx="54" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24"/></g>
  <text x="188" y="242" class="eyebrow">ROADMAP</text>
  <text x="188" y="316" class="title">Scale by clear stages</text>
  <g transform="translate(190 458)">
    <path d="M78 214h1052" stroke="#ffffff" stroke-opacity=".34" stroke-width="18" stroke-linecap="round"/>
    <circle cx="78" cy="214" r="34" fill="#ffffff" opacity=".96"/>
    <circle cx="430" cy="214" r="34" fill="#91f7d2" opacity=".96"/>
    <circle cx="770" cy="214" r="34" fill="#cfd3ff" opacity=".96"/>
    <circle cx="1130" cy="214" r="34" fill="#ffd27d" opacity=".96"/>
    <rect x="0" y="0" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
    <rect x="320" y="0" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
    <rect x="660" y="0" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
    <rect x="1000" y="0" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
    <rect x="0" y="276" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
    <rect x="320" y="276" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
    <rect x="660" y="276" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
    <rect x="1000" y="276" width="220" height="120" rx="34" fill="#ffffff" opacity=".12"/>
  </g>

</svg>
