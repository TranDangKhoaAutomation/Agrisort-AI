<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="Capability illustration for operational impact">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c6b54"/>
      <stop offset="100%" stop-color="#ff8a56"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57df92"/>
      <stop offset="100%" stop-color="#ffbb49"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.30)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,.08)"/>
    </linearGradient>
    <filter id="blur-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#101938" flood-opacity=".16"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#121b3d" flood-opacity=".12"/>
    </filter>
    <style>
    .title { font: 800 44px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.96); letter-spacing: .04em; }
    .eyebrow { font: 700 18px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.82); letter-spacing: .18em; text-transform: uppercase; }
    .label { font: 700 20px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.9); }
    .small { font: 600 16px 'Segoe UI', 'Be Vietnam Pro', sans-serif; fill: rgba(255,255,255,.74); }
</style>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
