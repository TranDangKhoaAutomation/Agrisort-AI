    <path d="M142 390h156" stroke="#ffffff" stroke-opacity=".26" stroke-width="16" stroke-linecap="round"/>
  </g>
  <g transform="translate(736 428)">
    <path d="M0 122c120-112 260-160 424-162" stroke="#ffffff" stroke-opacity=".76" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M0 122c158-10 278 44 400 172" stroke="#8ae0ff" stroke-width="14" stroke-linecap="round" fill="none"/>
