    <path d="M84 1034c220-76 388-86 542-22s338 74 544 14 310-66 424-26"/>
  </g>
  
  <g filter="url(#shadow)"><rect x="126" y="150" width="1348" height="820" rx="54" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.24"/></g>
  <text x="188" y="242" class="eyebrow">VISION STACK</text>
  <text x="188" y="316" class="title">Camera to AI pipeline</text>
